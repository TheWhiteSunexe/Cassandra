<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Cassandra</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="screen">

    <!-- BACKGROUND -->
    <img id="background" src="images/background.png">


    <!-- CASSANDRA -->
    <!-- CASSANDRA -->

    <div id="cassandra">

        <!-- IMAGE FIXE -->
        <img
            id="cassandraImage"
            src="images/cassandraNormal.png"
            alt="Cassandra"
        >

        <!-- YEUX ANIMÉS -->
        <img
            id="cassandraEyes"
            src="images/eyes/eyes1.png"
            alt=""
        >
        <img
            id="cassandraMouth"
            src="images/mouth/mouth1.png"
            alt=""
        >

    </div>


    <!-- LEFT INFORMATION -->

    <div id="leftInfo">

        <div class="dataBlock">

            <div class="label">
                HEURE
            </div>

            <div id="clock" class="value">
                00:00
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                DATE
            </div>

            <div id="date" class="value small">
                7 SEPTEMBRE
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                TEMPÉRATURE
            </div>

            <div id="temperature" class="value">
                21.4°
            </div>

        </div>

    </div>



    <!-- RIGHT INFORMATION -->

    <div id="rightInfo">

        <div class="dataBlock">

            <div class="label">
                MÉTÉO
            </div>

            <div id="weather" class="value">
                NUAGEUX
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                PROCHAIN RER
            </div>

            <div id="rer" class="value">
                4 MIN
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                MAISON
            </div>

            <div id="houseStatus" class="value">
                ACTIVE
            </div>

        </div>

    </div>


</div>


<script src="app.js"></script>

</body>

</html>
