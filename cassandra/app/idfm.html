<script src="js/external.js"></script>
<script src="js/idfm.js"></script>
<script src="js/transport.js"></script>


<script>

function updateTransportClock() {

    var now =
        new Date();

    var hours =
        String(
            now.getHours()
        ).padStart(2, "0");

    var minutes =
        String(
            now.getMinutes()
        ).padStart(2, "0");

    var seconds =
        String(
            now.getSeconds()
        ).padStart(2, "0");


    var clock =
        document.getElementById(
            "transportClock"
        );


    if (clock) {

        clock.textContent =
            hours +
            ":" +
            minutes +
            ":" +
            seconds;
    }
}


updateTransportClock();


setInterval(
    updateTransportClock,
    1000
);


startIDFM();

</script>
