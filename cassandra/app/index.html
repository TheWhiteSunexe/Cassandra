<!DOCTYPE html>
<html>

<head>

    <meta charset="UTF-8">

    <title>Cassandra</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div id="screen">

    <!-- =====================================
         BACKGROUND
         ===================================== -->

    <img
        id="background"
        src="images/background.png"
        alt=""
    >


    <!-- =====================================
         CASSANDRA
         ===================================== -->

    <div id="cassandra">

        <!-- IMAGE FIXE -->

        <img
            id="cassandraImage"
            src="images/cassandraNormal.png"
            alt="Cassandra"
        >


        <!-- YEUX -->

        <img
            id="cassandraEyes"
            src="images/eyes/Eyes1.png"
            alt=""
        >


        <!-- BOUCHE -->

        <img
            id="cassandraMouth"
            src="images/mouth/Mouth1.png"
            alt=""
        >

    </div>


    <!-- =====================================
         INFORMATIONS GAUCHE
         ===================================== -->

    <div id="leftInfo">

        <div class="dataBlock">

            <div class="label">
                HEURE
            </div>

            <div
                id="clock"
                class="value"
            >
                00:00
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                DATE
            </div>

            <div
                id="date"
                class="value small"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                TEMPÉRATURE
            </div>

            <div
                id="temperature"
                class="value"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                HUMIDITÉ
            </div>

            <div
                id="humidity"
                class="value"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                QUALITÉ AIR
            </div>

            <div
                id="airQuality"
                class="value small"
            >
                ----
            </div>

        </div>

    </div>


    <!-- =====================================
         INFORMATIONS DROITE
         ===================================== -->

    <div id="rightInfo">

        <div class="dataBlock">

            <div class="label">
                MÉTÉO
            </div>

            <div
                id="weather"
                class="value"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                CO₂
            </div>

            <div
                id="co2"
                class="value"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                LUMINOSITÉ
            </div>

            <div
                id="brightness"
                class="value"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                PORTE
            </div>

            <div
                id="door"
                class="value"
            >
                ----
            </div>

        </div>


        <div class="dataBlock">

            <div class="label">
                MUSIQUE
            </div>

            <div
                id="music"
                class="value small"
            >
                ----
            </div>

        </div>

    </div>


    <!-- =====================================
         BROUILLARD GLOBAL
         ===================================== -->

    <div id="mist">

        <img
            id="mistImage"
            src="images/mist/Mist9.png"
            alt=""
        >

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script src="js/config.js"></script>
<script src="js/clock.js"></script>
<script src="js/images.js"></script>
<script src="js/eyes.js"></script>
<script src="js/mouth.js"></script>
<script src="js/expressions.js"></script>
<script src="js/breathing.js"></script>
<script src="js/homeassistant.js"></script>
<script src="js/mist.js"></script>
<script src="js/behavior.js"></script>
<script src="app.js"></script>

</body>

</html>
