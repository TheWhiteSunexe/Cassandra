<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cassandra</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="appScreen" id="cassandraScreen">
<!-- =====================================
             BACKGROUND
             ===================================== -->
<img alt="" id="background" src="images/background.png"/>
<div id="fish">
<img alt="" id="fishImage" src="images/fish/Fish1.png"/>
</div>
<!-- =====================================
             CASSANDRA
             ===================================== -->
<div id="cassandra">
<img alt="Cassandra" id="cassandraImage" src="images/cassandraNormal.png"/>
<img alt="" id="cassandraBody" src="images/body/cassandraBody.png"/>
<img alt="" id="cassandraEyes" src="images/eyes/Eyes1.png"/>
<img alt="" id="cassandraMouth" src="images/mouth/Mouth1.png"/>
</div>
<!-- =====================================
             INFORMATIONS GAUCHE
             ===================================== -->
<div id="leftInfo">
<div class="dataBlock">
<div class="label">
                    HEURE
                </div>
<div class="value" id="clock">
                    00:00
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    DATE
                </div>
<div class="value small" id="date">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    TEMPÉRATURE
                </div>
<div class="value" id="temperature">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    HUMIDITÉ
                </div>
<div class="value" id="humidity">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    QUALITÉ AIR
                </div>
<div class="value small" id="airQuality">
                    ----
                </div>
</div>
</div>
<!-- =====================================
             INFORMATIONS DROITE
             ===================================== -->
<div id="rightInfo">
<div class="dataBlock">
<div class="label">
                    MÉTÉO
                </div>
<div class="value" id="weather">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    CO₂
                </div>
<div class="value" id="co2">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    LUMINOSITÉ
                </div>
<div class="value" id="brightness">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    PORTE
                </div>
<div class="value" id="door">
                    ----
                </div>
</div>
<div class="dataBlock">
<div class="label">
                    MUSIQUE
                </div>
<div class="value small" id="music">
                    ----
                </div>
</div>
</div>
<!-- =====================================
             BROUILLARD GLOBAL
             ===================================== -->
<div id="mist">
<img alt="" id="mistImage" src="images/mist/Mist9.png"/>
</div>
</div>
<script src="js/config.js"></script>
<script src="js/clock.js"></script>
<script src="js/images.js"></script>
<script src="js/eyes.js"></script>
<script src="js/fish.js"></script>
<script src="js/mouth.js"></script>
<script src="js/expressions.js"></script>
<script src="js/breathing.js"></script>
<script src="js/homeassistant.js"></script>
<script src="js/mist.js"></script>
<script src="js/behavior.js"></script>
<script src="app.js"></script>
</body>
</html>
