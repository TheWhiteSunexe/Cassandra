<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cassandra</title>

<style>
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #050608;
}

#app {
    position: relative;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

.appFrame {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    display: none;
    background: #050608;
}

.appFrame.active {
    display: block;
}

#screenSelector {
    position: fixed;
    right: 20px;
    bottom: 20px;
    z-index: 9999;

    display: flex;
    gap: 8px;
    padding: 8px;

    background: rgba(5, 6, 8, 0.90);
    border: 1px solid rgba(255, 170, 0, 0.35);

    font-family: "Courier New", monospace;
}

#screenSelector button {
    min-width: 44px;
    min-height: 36px;
    padding: 5px 10px;

    background: transparent;
    border: 1px solid rgba(255, 170, 0, 0.45);
    color: #f5a400;

    font-family: inherit;
    cursor: pointer;
}

#screenSelector button.active,
#screenSelector button:hover {
    background: #f5a400;
    color: #050608;
}
</style>
</head>

<body>

<div id="app">

    <iframe
        id="cassandraFrame"
        class="appFrame active"
        src="cassandra.html"
        title="Cassandra"
    ></iframe>

    <iframe
        id="idfmFrame"
        class="appFrame"
        src="idfm.html"
        title="Transports IDFM"
    ></iframe>

</div>

<div id="screenSelector">

    <button
        type="button"
        id="screenButton1"
        class="active"
    >1</button>

    <button
        type="button"
        id="screenButton2"
    >2</button>

</div>

<script>

var currentScreen = 1;


function setScreen(screenNumber) {

    screenNumber =
        Number(screenNumber);

    if (
        screenNumber !== 1 &&
        screenNumber !== 2
    ) {
        screenNumber = 1;
    }

    currentScreen =
        screenNumber;

    document
        .getElementById("cassandraFrame")
        .classList.toggle(
            "active",
            screenNumber === 1
        );

    document
        .getElementById("idfmFrame")
        .classList.toggle(
            "active",
            screenNumber === 2
        );

    document
        .getElementById("screenButton1")
        .classList.toggle(
            "active",
            screenNumber === 1
        );

    document
        .getElementById("screenButton2")
        .classList.toggle(
            "active",
            screenNumber === 2
        );
}


document
    .getElementById("screenButton1")
    .addEventListener(
        "click",
        function() {
            setScreen(1);
        }
    );


document
    .getElementById("screenButton2")
    .addEventListener(
        "click",
        function() {
            setScreen(2);
        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "1") {
            setScreen(1);
        }

        if (event.key === "2") {
            setScreen(2);
        }
    }
);


setScreen(1);

</script>

</body>
</html>
